name: Build Windows exe

# 手动跑：Actions -> Build Windows exe -> Run workflow
# 打 tag v1.1.7 这种也会自动跑，并把产物挂到 Release 上
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: pip install pyinstaller

      # 注意：这个项目只有标准库，没有 requirements.txt，不用 pip install -r
      # 入口 wb_proxy.py，dashboard.html 必须一起打包，
      # 否则打开 http://127.0.0.1:8788/ 会没有看板。
      # 用 --onedir 不用 --onefile：--onefile 会把 accounts/usage
      # 写到临时解压目录，退出就丢，账号和用量都存不住。
      - name: Build exe with PyInstaller
        run: pyinstaller --noconfirm --clean --onedir --console --name wb-proxy --add-data "dashboard.html;." wb_proxy.py

      - name: Check output
        run: |
          dir dist\wb-proxy
          dist\wb-proxy\wb-proxy.exe --help

      - name: Zip package
        run: Compress-Archive -Path dist\wb-proxy -DestinationPath wb-proxy-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wb-proxy-windows
          path: wb-proxy-windows.zip

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: wb-proxy-windows.zip
